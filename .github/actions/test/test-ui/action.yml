name: Test UI Unit Tests
description: Runs Angular Vitest unit tests (.spec.ts)
runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: Morpheus.Web/package-lock.json

    - name: Install dependencies
      run: npm ci
      shell: bash
      working-directory: Morpheus.Web

    - name: Run Angular UI Tests
      run: npm run test -- --watch=false
      shell: bash
      working-directory: Morpheus.Web