<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 transition-all duration-300 hover:shadow-xl hover:-translate-y-1 hover:border-indigo-100 group cursor-pointer" (click)="cardClick.emit(job)">
  <div class="flex items-start gap-4">
    <!-- Company Logo -->
    <div class="w-16 h-16 rounded-xl overflow-hidden bg-gray-50 flex-shrink-0 border border-gray-100 shadow-inner">
      <img [src]="job.companyLogo" [alt]="job.company + ' logo'" class="w-full h-full object-cover">
    </div>
    
    <!-- Job Info -->
    <div class="flex-grow">
      <div class="flex justify-between items-start">
        <div>
          <h3 class="text-lg font-bold text-gray-900 group-hover:text-indigo-600 transition-colors leading-tight">
            {{ job.title }}
          </h3>
          <p class="text-sm font-medium text-gray-600 mt-1">{{ job.company }}</p>
        </div>
        
        <!-- Relevance Score Badge -->
        <div class="flex items-center gap-1 bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full border border-indigo-100 shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
          <span class="text-xs font-bold">{{ getRelevancePercentage() }}% Match</span>
        </div>
      </div>
      
      <!-- Metadata -->
      <div class="mt-4 flex flex-wrap gap-y-2 gap-x-4 text-sm text-gray-500">
        <div class="flex items-center gap-1.5">
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          {{ job.location }}
        </div>
        <div class="flex items-center gap-1.5">
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
          {{ job.contractType }} &bull; {{ job.seniorityLevel }}
        </div>
        <div class="flex items-center gap-1.5">
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          {{ job.publishedAt | date:'mediumDate' }}
        </div>
      </div>
      
      <!-- Actions -->
      <div class="mt-5 flex justify-between items-center pt-4 border-t border-gray-100">
        <button class="text-gray-500 hover:text-red-500 transition-colors flex items-center gap-2 text-sm font-medium" (click)="$event.stopPropagation()">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
          Save
        </button>
        <a [href]="job.applyUrl" target="_blank" rel="noopener noreferrer" (click)="$event.stopPropagation()"
           class="inline-flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          Apply Now
        </a>
      </div>
    </div>
  </div>
</div>
